name: Portfolio winner refresh

on:
  push:
    branches:
      - portfolio-refresh-2026-09-14
    paths:
      - .github/workflows/portfolio-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-refresh-2026-09-14
          fetch-depth: 0

      - name: RED - prove expectations are not already satisfied
        shell: bash
        run: |
          set +e
          python scripts/test-portfolio-refresh.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the pre-refresh contract to fail, but it passed."
            exit 1
          fi
          echo "RED confirmed: refresh expectations fail before implementation."

      - name: Apply winner-only portfolio refresh
        run: python scripts/refresh-portfolio.py

      - name: Normalize generated CSS EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('style.css')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: GREEN - verify portfolio contract
        run: python scripts/test-portfolio-refresh.py

      - name: Verify clean patch
        run: git diff --check

      - name: Commit verified portfolio refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/refresh-portfolio.py .github/workflows/portfolio-refresh.yml
          git add index.html work.html style.css scripts/test-portfolio-refresh.py docs/superpowers
          git commit -m "feat: add winner-first 2026 portfolio refresh"
          git push origin HEAD:portfolio-refresh-2026-09-14
